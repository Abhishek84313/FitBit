name: Deploy API to MonsterASP.NET

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    # WebDeploy (msdeploy.exe) is Windows-only, so this cannot run on ubuntu.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/FitBit.Api/FitBit.Api.csproj

      - name: Publish
        # win-x86 matches MonsterASP's 32-bit app pool; --no-self-contained keeps
        # the payload small because the .NET 10 runtime is already installed there.
        run: >
          dotnet publish server/FitBit.Api/FitBit.Api.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --no-self-contained

      - name: Write appsettings.Production.json
        shell: pwsh
        # Secrets arrive through env rather than ${{ }} interpolation: a Mongo
        # connection string contains characters PowerShell would otherwise parse.
        env:
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          # Report every missing secret at once. Throwing on the first costs a
          # full build-and-fail cycle per secret to discover the rest.
          $missing = @('MONGODB_CONNECTION_STRING', 'JWT_KEY', 'CORS_ALLOWED_ORIGINS') |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }

          if ($missing) {
            throw "Missing repository secret(s): $($missing -join ', '). " +
                  "Add them under Settings > Secrets and variables > Actions, as " +
                  "Repository secrets — environment secrets and variables are not visible here."
          }

          # Program.cs throws on a short key, which would deploy successfully and
          # then fail at startup as an opaque 500.30. Catch it before shipping.
          if ($env:JWT_KEY.Length -lt 32) {
            throw "JWT_KEY must be at least 32 characters; got $($env:JWT_KEY.Length)."
          }

          Write-Host "Secrets present; JWT_KEY length $($env:JWT_KEY.Length)."

          # Accept comma-, semicolon- or newline-separated origins: pasting one
          # per line into the GitHub secrets box is the natural thing to do, and
          # the failure it caused otherwise is invisible until a browser call.
          # The trailing slash is stripped for the same reason — an origin is
          # scheme + host, and "https://x/" never matches what the browser sends.
          $origins = @($env:CORS_ALLOWED_ORIGINS -split '[,;\s]+' |
            ForEach-Object { $_.Trim().TrimEnd('/') } |
            Where-Object { $_ })

          $bad = @($origins | Where-Object { $_ -notmatch '^https?://[^/]+$' })
          if ($bad) {
            throw "CORS_ALLOWED_ORIGINS contains entries that are not bare origins: $($bad -join ', ')"
          }

          Write-Host "CORS origins ($($origins.Count)): $($origins -join '  |  ')"

          $settings = [ordered]@{
            MongoDb = [ordered]@{
              ConnectionString = $env:MONGODB_CONNECTION_STRING
              DatabaseName     = 'Fitbit'
              CollectionName   = 'FitnessTracker'
            }
            Jwt = [ordered]@{
              Key           = $env:JWT_KEY
              Issuer        = 'FitBit.Api'
              Audience      = 'FitBit.Client'
              ExpiryMinutes = 720
            }
            Cors = [ordered]@{
              AllowedOrigins = $origins
            }
          }

          $settings | ConvertTo-Json -Depth 5 |
            Set-Content ./publish/appsettings.Production.json -Encoding utf8

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
